
<!DOCTYPE html>
<html lang="es">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

body {
  margin: 0;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr; /* Divide la pantalla en dos partes iguales */
  overflow: hidden;
}
.boton {
  margin: 20px 0; /* Espaciado arriba y abajo */
  padding: 10px 25px;
  border: 2px solid black;
  background-color: white;
  color: #1062FE;
  font-size: 16px;
  font-weight: bold;
  border-radius: 25px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: 0.3s;
}
.izquierda {
  background-color: #1062FE; /* Azul fuerte */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  padding: 90px;
  text-align: center;

}
h1 {
  font-size: 80px;
  text-transform: uppercase;
  margin-bottom: 20px; 
}

h3 {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 30px; /* Espacio debajo del subtítulo */
}

.texto-inferior {
  font-size: 20px;
  font-weight: 300;
}
.derecha{
  width: 550px;  
  height: 200px; 
  display: block;  
  margin: 0 auto; 
    
  
}
    </style>
<body>
    <div class="izquierda"><h1>Bienvenido</h1> 
      <h3>Utiliza nuestro bote inteligente</h3>
        <button class="boton" (click)="irARegistro()">Registrate Ahora</button>
        <p class="texto-inferior">Creando soluciones modernas para problemas modernos</p>
    </div>
    
    <div class="derecha">
      <img src="/home.png">  
    </div>
</body>
</html>
